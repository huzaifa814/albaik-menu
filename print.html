<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AL BAIK - Print QR cards</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d0d0d'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23ffcc00' font-family='Arial' font-weight='bold'%3EA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .tools{max-width:820px;margin:0 auto;padding:18px 16px}
  .tools label{display:inline-block;margin-right:16px;font-size:14px;color:var(--muted)}
  .tools input,.tools select{padding:8px 10px;border-radius:10px;background:var(--panel-2);border:1px solid #333;margin-left:6px}
  .tools button{padding:10px 16px;border-radius:10px;border:none;background:var(--gold);color:#1a1200;font-weight:700;margin-top:12px}

  .sheet-print{max-width:820px;margin:0 auto;padding:0 16px 40px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .qcard{
    background:#0d0d0d;color:#fff;border:2px solid #ffc31f;border-radius:14px;
    padding:16px 12px;text-align:center;break-inside:avoid;page-break-inside:avoid;
  }
  .qcard .q-brand{font-size:22px;font-weight:800;color:#ffd400;letter-spacing:.06em}
  .qcard .q-sub{font-size:9px;letter-spacing:.3em;color:#f5a01c;margin-bottom:8px}
  .qcard .q-line{font-size:13px;color:#fff;margin:6px 0 8px;font-weight:600;letter-spacing:.04em}
  .qcard img{width:78%;max-width:230px;background:#fff;padding:8px;border-radius:8px;display:block;margin:0 auto}
  .qcard .q-table{font-size:26px;font-weight:800;color:#ffd400;margin-top:10px}
  .qcard .q-foot{font-size:10px;color:#bbb;margin-top:6px}

  @media print{
    body{background:#fff;padding:0}
    .topbar,.tools,.foot{display:none!important}
    .sheet-print{max-width:none;padding:0;grid-template-columns:1fr 1fr;gap:6mm}
    .qcard{border-color:#000;background:#fff;color:#000}
    .qcard .q-brand{color:#000}
    .qcard .q-sub,.qcard .q-foot{color:#444}
    .qcard .q-table{color:#000}
    @page{size:A4;margin:10mm}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="brand-name">AL BAIK</span><span class="brand-sub">QR CARDS</span></div>
</header>

<div class="tools">
  <p class="foot-note" style="text-align:left;margin:0 0 12px">
    Run <code>python tools/make_qr.py --base &lt;your site url&gt;</code> first, then print this page (Ctrl+P) on card stock.
  </p>
  <label>Cards
    <select id="kind">
      <option value="table">Table menu QR</option>
      <option value="review">Google review QR</option>
    </select>
  </label>
  <label>From <input type="number" id="from" value="1" min="1" style="width:70px"></label>
  <label>To <input type="number" id="to" value="20" min="1" style="width:70px"></label>
  <label>Copies <input type="number" id="copies" value="1" min="1" style="width:70px"></label>
  <br><button id="go">Build cards</button>
  <button id="printBtn">Print</button>
</div>

<div class="sheet-print" id="sheet"></div>

<script>
(function () {
  var sheet = document.getElementById("sheet");

  function card(imgSrc, line, big, foot) {
    return '<div class="qcard">' +
      '<div class="q-brand">AL BAIK</div>' +
      '<div class="q-sub">CHICKEN N PIZZA</div>' +
      '<div class="q-line">' + line + "</div>" +
      '<img src="' + imgSrc + '" alt="QR code">' +
      (big ? '<div class="q-table">' + big + "</div>" : "") +
      '<div class="q-foot">' + foot + "</div>" +
    "</div>";
  }

  function build() {
    var kind = document.getElementById("kind").value;
    var from = +document.getElementById("from").value;
    var to = +document.getElementById("to").value;
    var copies = +document.getElementById("copies").value;
    var out = "";

    if (kind === "review") {
      for (var c = 0; c < copies; c++) {
        out += card("qr/review.png", "ENJOYED YOUR MEAL?", "", "Scan to leave us a Google review");
      }
    } else {
      for (var n = from; n <= to; n++) {
        var pad = ("0" + n).slice(-2);
        for (var k = 0; k < copies; k++) {
          out += card("qr/table-" + pad + ".png", "SCAN FOR THE MENU", "Table " + n, "Browse, pick your food, call the waiter");
        }
      }
    }
    sheet.innerHTML = out;
  }

  document.getElementById("go").addEventListener("click", build);
  document.getElementById("printBtn").addEventListener("click", function () { window.print(); });
  build();
})();
</script>
</body>
</html>
