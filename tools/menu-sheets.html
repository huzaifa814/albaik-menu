<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AL BAIK - menu sheets for Google</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0b09; --surface:#17140f; --line:#2a241d; --hair:#211c16;
    --gold:#f5a01c; --gold-bright:#ffd94a; --text:#f6f2ea; --muted:#a49c8e;
    --display:"Anton","Arial Narrow",Impact,sans-serif;
    --body:"Inter","Segoe UI",Roboto,system-ui,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#000;font-family:var(--body);color:var(--text)}

  /* each sheet is exactly what gets screenshotted */
  .sheet{
    width:1200px;height:1600px;
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(255,175,20,.10), transparent 60%),
      var(--bg);
    padding:54px 56px 44px;
    display:flex;flex-direction:column;
    position:relative;overflow:hidden;
    margin:0 auto 26px;
  }

  .brand{display:flex;align-items:center;gap:20px;margin-bottom:26px}
  .brand img{width:250px;height:auto}
  .brand .who{flex:1;text-align:right}
  .brand .halal{
    display:inline-block;padding:5px 14px;border-radius:999px;
    border:1px solid rgba(93,196,124,.55);background:rgba(16,36,24,.7);
    color:#8ee0a6;font-size:14px;font-weight:700;letter-spacing:.14em;
  }
  .brand .addr{margin:9px 0 0;color:var(--muted);font-size:15px;line-height:1.45}

  .cols{flex:1 1 0;min-height:0;column-count:2;column-gap:34px;overflow:hidden}

  .sec{break-inside:auto;margin:0 0 22px}
  .sec h2,.note,.sizes{break-after:avoid}
  .item{break-inside:avoid}
  .sec h2{
    margin:0 0 9px;font-family:var(--display);font-weight:400;
    font-size:29px;line-height:1;letter-spacing:.02em;text-transform:uppercase;
    color:var(--gold-bright);
    border-bottom:2px solid var(--gold);padding-bottom:7px;
    display:flex;align-items:baseline;gap:10px;
  }
  .sec h2 .soon{
    font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.1em;
    color:#1a1207;background:var(--gold-bright);
    padding:3px 9px;border-radius:999px;
  }
  .note{margin:-3px 0 9px;color:var(--muted);font-size:13.5px;line-height:1.4}

  .sizes{
    display:grid;grid-template-columns:repeat(4,1fr);gap:5px;
    border:1px solid var(--line);border-radius:10px;
    padding:9px 6px;margin-bottom:10px;background:var(--surface);
  }
  .sizes div{text-align:center}
  .sizes b{display:block;color:var(--gold);font-size:17px;font-variant-numeric:tabular-nums}
  .sizes span{display:block;color:var(--muted);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase}

  .row{
    display:flex;align-items:baseline;gap:8px;
    padding:5px 0;font-size:16px;line-height:1.35;
  }
  .row .nm{font-weight:600;white-space:nowrap}
  .row .dots{flex:1;border-bottom:1px dotted #4a4238;transform:translateY(-4px)}
  .row .pr{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
  .row.soon .nm,.row.soon .pr{opacity:.6}
  .desc{margin:0 0 4px;padding-left:2px;color:var(--muted);font-size:12.5px;line-height:1.4}

  .chilli{width:15px;height:15px;vertical-align:-2px;margin-left:5px}
  .chilli .stem{fill:none;stroke:#66b535;stroke-width:3;stroke-linecap:round}
  .chilli .cap{fill:#66b535}
  .chilli .pod{fill:#ef3419}

  .foot{
    margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:center;
    color:var(--muted);font-size:14px;
  }
  .foot b{color:var(--gold-bright);font-weight:700}
</style>
</head>
<body>

<div id="out"></div>

<script src="../assets/js/config.js"></script>
<script src="../assets/js/menu-data.js"></script>
<script>
(function () {
  var CFG = window.ALBAIK_CONFIG, MENU = window.ALBAIK_MENU;
  var CUR = CFG.currency || "$";
  var money = function (n) { return CUR + n.toFixed(2); };
  var esc = function (s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c];
    });
  };

  var CHILLI =
    '<svg class="chilli" viewBox="0 0 32 32">' +
    '<path class="stem" d="M18.6 8.4c1-2.6 3-4.2 5.6-4.6"/>' +
    '<path class="cap" d="M13.6 7.9c2.4-1.1 5-1 7.2.4.8.5.7 1.7-.2 2l-6.3 2.2c-1.1.4-2.1-.7-1.6-1.7z"/>' +
    '<path class="pod" d="M13.9 10.4c-4.3 4.5-5.2 12.3-2 18.6.4.9 1.6 1 2.3.3 5.5-5.3 8.2-12.6 7-19.1-.2-1.3-1.9-1.7-2.8-.8z"/>' +
    '</svg>';

  function sectionHTML(sec) {
    var h = '<div class="sec"><h2>' + esc(sec.name) +
      (sec.soon ? '<span class="soon">Coming soon</span>' : "") + "</h2>";
    if (sec.note) h += '<p class="note">' + esc(sec.note) + "</p>";

    if (sec.sizes) {
      h += '<div class="sizes">' + sec.sizes.map(function (s) {
        return "<div><span>" + esc(s.label) + "</span><b>" + money(s.price) + "</b></div>";
      }).join("") + "</div>";
    }

    sec.items.forEach(function (it) {
      var price = typeof it.price === "number" ? money(it.price) : "";
      h += '<div class="item"><div class="row' + (sec.soon ? " soon" : "") + '">' +
             '<span class="nm">' + esc(it.name) + (it.spicy ? CHILLI : "") + "</span>" +
             (price ? '<span class="dots"></span><span class="pr">' + price + "</span>" : "") +
           "</div>" +
           // descriptions only where the sizes grid already carries the price
           (it.desc && !price ? '<p class="desc">' + esc(it.desc) + "</p>" : "") +
           "</div>";
    });
    return h + "</div>";
  }

  // greedy fill: keep adding sections until the columns overflow the sheet
  var out = document.getElementById("out");
  var queue = MENU.slice(), sheets = [], n = 0;

  function newSheet(first) {
    var s = document.createElement("div");
    s.className = "sheet";
    s.innerHTML =
      '<div class="brand">' +
        '<img src="../assets/img/logo.png" alt="AL BAIK">' +
        '<div class="who">' +
          (CFG.halal ? '<span class="halal">100% HALAL</span>' : "") +
          '<p class="addr">' + esc(CFG.address) + "<br>" + esc(CFG.phoneDisplay) +
          "<br>Open 7 days &middot; 11 AM - 10 PM</p>" +
        "</div>" +
      "</div>" +
      '<div class="cols"></div>' +
      '<div class="foot"><span>Full menu with photos: <b>albaik.dpdns.org</b></span>' +
      '<span class="pg"></span></div>';
    out.appendChild(s);
    sheets.push(s);
    return s;
  }

  var sheet = newSheet(true), cols = sheet.querySelector(".cols");

  function fits() { return cols.scrollWidth <= cols.clientWidth + 1; }

  function tryPlace(sec) {
    var probe = document.createElement("div");
    probe.innerHTML = sectionHTML(sec);
    var node = probe.firstChild;
    cols.appendChild(node);
    if (fits()) return true;
    cols.removeChild(node);
    return false;
  }

  // Pizza alone fills a whole column, so a plain first-fit leaves a hole under it.
  // Each pass walks everything still unplaced and takes whatever slots into the gap;
  // only when a full pass places nothing does the sheet get closed off.
  while (queue.length) {
    var placedAny = false;
    for (var i = 0; i < queue.length; i++) {
      if (tryPlace(queue[i])) { queue.splice(i, 1); i--; placedAny = true; }
    }
    if (queue.length) {
      if (!placedAny && !cols.children.length) {
        // a single section taller than one sheet - let it overflow rather than loop
        var probe = document.createElement("div");
        probe.innerHTML = sectionHTML(queue.shift());
        cols.appendChild(probe.firstChild);
      }
      if (queue.length) {
        sheet = newSheet(false);
        cols = sheet.querySelector(".cols");
      }
    }
  }

  // the last sheet is usually part empty, and a half-black photo looks sloppy in a
  // Google gallery - shrink it until the content only just still fits
  (function trimLast() {
    var last = sheets[sheets.length - 1];
    var c = last.querySelector(".cols");
    var h = 1600;
    while (h > 700) {
      last.style.height = (h - 20) + "px";
      if (c.scrollWidth > c.clientWidth + 1) { last.style.height = h + "px"; break; }
      h -= 20;
    }
  })();

  sheets.forEach(function (s, i) {
    s.querySelector(".pg").textContent = "Page " + (i + 1) + " of " + sheets.length;
    s.id = "sheet-" + (i + 1);
  });
  window.SHEETS = sheets.length;
})();
</script>
</body>
</html>
