<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AL BAIK - Chicken N Pizza | Menu</title>
<meta name="description" content="AL BAIK Chicken N Pizza - the full menu: fried chicken, pizza, kabob, wraps, burgers and more.">
<meta name="theme-color" content="#0a0908">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230a0908'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='%23ffcc00' font-family='Arial' font-weight='bold'%3EA%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="AL BAIK">

<!-- link preview when the menu is shared on WhatsApp / Facebook -->
<meta property="og:type" content="website">
<meta property="og:title" content="AL BAIK - Chicken N Pizza">
<meta property="og:description" content="The full menu: fried chicken, pizza, kabob, wraps, burgers and more.">
<meta property="og:image" content="https://huzaifa814.github.io/albaik-menu/assets/img/hero.webp">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/img/hero.webp">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="hero">
  <div class="hero-bg" style="background-image:url('assets/img/hero.webp')"></div>
  <div class="hero-inner">
    <img class="hero-logo" src="assets/img/logo.webp" alt="AL BAIK - Chicken N Pizza" width="900" height="256">
    <p class="hero-tag">Fried Chicken &middot; Pizza &middot; Kabob</p>
    <div class="hero-chips">
      <a id="callBtn" href="#">Call us</a>
      <a href="review.html">&#9733; Leave a review</a>
    </div>
  </div>
</header>

<div class="searchwrap">
  <input type="search" id="search" placeholder="Search the menu..." autocomplete="off" aria-label="Search the menu">
</div>

<nav class="catnav" id="catnav" aria-label="Menu sections"></nav>

<main id="menu"></main>

<footer class="foot">
  <img class="foot-logo" src="assets/img/logo.webp" alt="" width="900" height="256" loading="lazy">
  <a class="foot-btn" href="review.html">Leave us a Google review</a>
  <p class="foot-note">Tap any dish to see it bigger.<br>Ready to order? Your waiter will take it at the table.</p>
</footer>

<!-- dish detail, read only -->
<div class="sheet-backdrop" id="itemBackdrop" hidden>
  <section class="sheet" role="dialog" aria-modal="true" aria-labelledby="itemTitle">
    <button class="sheet-close" data-close-item aria-label="Close">&times;</button>
    <div class="sheet-hero"><img id="itemHeroImg" src="" alt=""></div>
    <div class="sheet-pad">
      <p class="sheet-kicker" id="itemKicker"></p>
      <h2 id="itemTitle"></h2>
      <p class="sheet-desc" id="itemDesc"></p>
      <div id="itemBody"></div>
      <button class="ghost" data-close-item>Close</button>
    </div>
  </section>
</div>

<script src="assets/js/config.js"></script>
<script src="assets/js/menu-data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
